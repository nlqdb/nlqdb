<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>rateme12 on nlqdb</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
      main { max-width: 34rem; line-height: 1.5; }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <h1>rateme12, rebuilt on nlqdb</h1>
      <p>
        This is a rebuild of rateme12 where every read and write goes through
        <a href="https://nlqdb.com">nlqdb</a>, and nlqdb works out the database schema
        from the app's own data. Nobody writes it by hand.
      </p>
      <p><strong>Not connected yet.</strong> The pages are still being built, and no data is stored here.</p>
    </main>
  </body>
</html>
