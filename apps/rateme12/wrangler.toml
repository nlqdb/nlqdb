name = "rateme12"
compatibility_date = "2026-04-27"

# Dogfood iteration 001 (GLOBAL-042) — docs/history/dogfood-iterations/001-rateme12.md.
# §5a step 4: static assets (styles, logo) are served first; every page route
# renders in the Worker and reads through src/data.ts only.
main = "src/worker.ts"
workers_dev = false

[assets]
directory = "./public"

[observability]
enabled = true

# Same pattern as apps/docs: wrangler provisions the proxied record + cert on
# first deploy.
[[routes]]
pattern = "rateme12.nlqdb.com"
custom_domain = true
