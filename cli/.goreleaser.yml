# Release config for the `nlq` CLI. Triggered by release-cli.yml on
# `v*` tag push. Local dry-run:
#   cd cli && goreleaser release --snapshot --clean --skip=publish,sbom

version: 2

project_name: nlq

before:
  hooks:
    - go mod tidy
    # Repo LICENSE lives at the root; stage a copy next to .goreleaser.yml so the archive picks it up.
    - sh -c 'cp ../LICENSE LICENSE.txt'
    # The update-check manifest (SK-CLI-015): attached to every release, and
    # nlqdb.com/install/latest.json redirects to the latest release's copy.
    - >-
      sh -c 'printf "%s\n" "{\"version\":\"{{ .Version }}\",\"released_at\":\"{{ .Date }}\",\"url_template\":\"https://github.com/nlqdb/nlqdb/releases/download/v{{ .Version }}/nlq_{{ .Version }}_{os}_{arch}.tar.gz\"}" > latest.json'

# One build per install channel: `InstallMethod` picks the upgrade hint
# (SK-CLI-015) and the User-Agent's channel field.
builds:
  - id: curl-sh
    binary: nlq
    main: ./cmd/nlq
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/nlqdb/nlqdb/cli/internal/version.Version={{ .Version }}
      - -X github.com/nlqdb/nlqdb/cli/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/nlqdb/nlqdb/cli/internal/version.InstallMethod=curl-sh
  - id: homebrew
    binary: nlq
    main: ./cmd/nlq
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/nlqdb/nlqdb/cli/internal/version.Version={{ .Version }}
      - -X github.com/nlqdb/nlqdb/cli/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/nlqdb/nlqdb/cli/internal/version.InstallMethod=homebrew
  - id: npm-shim
    binary: nlq
    main: ./cmd/nlq
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/nlqdb/nlqdb/cli/internal/version.Version={{ .Version }}
      - -X github.com/nlqdb/nlqdb/cli/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/nlqdb/nlqdb/cli/internal/version.InstallMethod=npm-shim

# The curl-sh archive keeps the unsuffixed name apps/web/public/install
# downloads; the others carry their channel as a suffix.
archives:
  - id: curl-sh
    ids: [curl-sh]
    name_template: >-
      {{- .ProjectName }}_
      {{- .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files: &archive_files
      - src: LICENSE.txt
        dst: LICENSE
      - README.md
  - id: homebrew
    ids: [homebrew]
    name_template: >-
      {{- .ProjectName }}_
      {{- .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}_homebrew
    files: *archive_files
  - id: npm-shim
    ids: [npm-shim]
    name_template: >-
      {{- .ProjectName }}_
      {{- .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}_npm-shim
    files: *archive_files

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - id: archive
    artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

brews:
  - name: nlq
    ids: [homebrew]
    # Skip (not 401-fail) the tap push when HOMEBREW_TAP_GITHUB_TOKEN is
    # unset/empty; `index` avoids the missing-key template error (SK-CLI-002).
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    repository:
      owner: nlqdb
      name: homebrew-tap
      # goreleaser v2 validates this field with ApplySingleEnvOnly: it must be the
      # bare `{{ .Env.VAR }}` form — the `index` form (fine for skip_upload above) is
      # rejected here. Safe when the PAT is unset: skip_upload short-circuits first.
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    homepage: https://nlqdb.com
    description: "Natural-language databases — talk to your data, ship without a backend."
    license: MIT
    install: |
      bin.install "nlq"
    test: |
      assert_match "nlq #{version} (homebrew", shell_output("#{bin}/nlq --version")

release:
  github:
    owner: nlqdb
    name: nlqdb
  name_template: "nlq {{ .Version }}"
  prerelease: auto
  # A workflow_dispatch re-run of an already-published tag must be able
  # to re-upload assets and reach the tap push — without this, goreleaser
  # 422s on the existing assets and aborts before publishing the formula
  # (observed re-seeding the tap once HOMEBREW_TAP_GITHUB_TOKEN was set).
  replace_existing_artifacts: true
  extra_files:
    - glob: ./latest.json
