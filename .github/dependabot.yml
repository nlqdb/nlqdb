# Weekly and grouped to bound PR noise: at most two PRs per ecosystem a week —
# minor+patch as one PR, which the scheduled run's reviewer mode merges on green
# (rules://scheduled-run § Bot PRs), and majors as a second, so one red major
# never blocks the safe group. A red majors PR is fixed or trimmed by the
# reviewer, never split back into one PR per package.
# nlqdb: the non-workspace suites under tests/ are listed explicitly — they
# are CI infrastructure and once piled up 19 unflagged advisories.
version: 2
updates:
  - package-ecosystem: bun
    directories: ["/", "/tests/e2e/examples", "/tests/e2e/mcp", "/tests/e2e/sdk"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      bun-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      bun-major:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: npm
    directory: /tests/opencheck
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: gomod
    directories: ["/cli", "/tests/e2e/cli"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      go-major:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: cargo
    directory: /packages/nlqdb-rs
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      cargo-major:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: bundler
    directory: /packages/nlqdb-rb
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      bundler-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      bundler-major:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: swift
    directory: /packages/nlqdb-swift
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      swift-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      swift-major:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/setup"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
