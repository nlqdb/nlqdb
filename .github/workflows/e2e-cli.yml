# Manual + reusable CLI e2e — hermetic testscript fixtures.
# Called by deploy-cli.yml on push to main, and runs on PRs touching
# cli/. See docs/features/e2e-coverage/FEATURE.md SK-E2E-002/004.

name: E2E CLI

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - "cli/**"
      - "tests/e2e/cli/**"
      - ".github/workflows/e2e-cli.yml"

concurrency:
  group: e2e-cli-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  run:
    name: cli testscript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: tests/e2e/cli/go.sum

      # Front-load the build so a broken cli/ surfaces here, not mid-testscript.
      - name: Verify cli builds before fixture run
        working-directory: cli
        run: go build ./...

      - name: Run testscript fixtures
        working-directory: tests/e2e/cli
        run: go test -count=1 -race ./...

      - name: Post-failure diagnostic
        if: failure()
        working-directory: tests/e2e/cli
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## CLI e2e — failure context"
            echo
            echo "### Fixtures discovered"
            ls -1 scripts/
            echo
            echo "### CLI build state"
            go -C ../../../cli build ./cmd/nlq && echo "build OK"
          } >> "$GITHUB_STEP_SUMMARY"
