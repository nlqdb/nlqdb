# Phase A dogfood workload — GLOBAL-041 build-order step 8, the KPI 1
# instrument. On every merge that touches the scorecard or the blocked-by-human
# queue, write the daily run's outputs — its "Last change" record, its scorecard
# row deltas and its new blocked-by-human items — into the hosted dogfood DB
# through `@nlqdb/sdk` (preview → confirm), as the run wrote them — no field
# pre-modeled. The write moves prod `asks_extend_ok/failed` (SK-SCHEMA-010) and
# opens the GLOBAL-041 200-insert window. CI, not the daily session: the prod
# key crosses only the workflow boundary (tools/eval/src/dogfood-write.ts).
# Self-skips green when the secret is absent.
#
# Mandatory pre-read for `.github/workflows/**`: docs/features/ci-permissions/FEATURE.md

name: Dogfood write

on:
  push:
    branches: [main]
    paths:
      - "docs/scorecard.md"
      - "docs/blocked-by-human.md"
  workflow_dispatch:

# Default-deny at the root (SK-CIPERM-001); the job reads its checkout and
# talks to the nlqdb API over a secret — it never writes back to the repo.
permissions: {}

# One write at a time so two quick merges land in order.
concurrency:
  group: dogfood-write
  cancel-in-progress: false

jobs:
  write:
    name: Write the run outputs to the dogfood DB
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Read this commit's Deploy API run (wait step below).
      actions: read
    steps:
      # The verdict must measure the build this merge ships. Deploy API fires on
      # the same push and syncs Worker secrets only after `wrangler deploy`, so
      # an unwaited write hits the old build or a secret-less one
      # (`auth_unavailable`, run 240). A merge that didn't touch the API has no
      # such run and writes after the 30 s look-up.
      - name: Wait for this commit's Deploy API run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `|| true`: a transient API error retries instead of failing the step (bash -e).
          for _ in 1 2 3 4 5 6; do
            id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy-api.yml \
              --commit "$GITHUB_SHA" --json databaseId -q '.[0].databaseId' || true)
            [ -n "$id" ] && break
            sleep 5
          done
          if [ -z "$id" ]; then echo "No Deploy API run for $GITHUB_SHA — writing now."; exit 0; fi
          if ! gh run watch "$id" -R "$GITHUB_REPOSITORY" --interval 15 --compact --exit-status; then
            msg="Deploy API run $id did not succeed — verdicts below measure the previous build."
            echo "::warning::$msg"
            echo "> $msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The push's `before` commit tells a new run record or bullet from an
          # unchanged one; the writer fetches it when the push had > 1 commit.
          fetch-depth: 2
      - uses: ./.github/actions/setup

      - name: Write the run record, row deltas and new blocked items
        working-directory: tools/eval
        env:
          NLQDB_API_KEY: ${{ secrets.NLQDB_API_KEY }}
          NLQDB_API_BASE: ${{ vars.NLQDB_API_BASE }}
          NLQDB_DOGFOOD_DB: ${{ vars.NLQDB_DOGFOOD_DB }}
          DOGFOOD_BASE: ${{ github.event.before }}
        run: bun src/dogfood-write.ts
