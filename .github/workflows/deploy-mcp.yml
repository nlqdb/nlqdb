# Auto-deploys apps/mcp on merge. Mirrors deploy-events-worker.yml —
# no D1, no asset bundle. wrangler auto-provisions OAUTH_KV +
# mcp.nlqdb.com DNS + cert on first run.
#
# secrets:remote — `scripts/mirror-secrets-workers.sh remote mcp`
# re-syncs the Worker-level secrets (BETTER_AUTH_SECRET + the OTel
# pair) from GHA → Worker after deploy, when latest = deployed (CF
# API code 10214 otherwise). BETTER_AUTH_SECRET is required: the
# OAuth bridge (SK-MCP-013) HMAC-signs the flow blob with it, and a
# missing value makes GET /authorize throw a raw 1101 (the 2026-06-25
# Cursor-install incident). Without this step every deploy leaves the
# Worker with no secrets.

name: Deploy MCP server

on:
  push:
    branches: [main]
    paths:
      - "apps/mcp/**"
      - "packages/mcp/**"
      - "packages/sdk/**"
      - "packages/otel/**"
      # Root `overrides` (security patches to bundled transitive deps, e.g.
      # fast-uri via the MCP SDK's ajv) must redeploy — see deploy-api.yml.
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-mcp.yml"
  workflow_dispatch:

concurrency:
  group: deploy-mcp
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/mcp
          command: deploy

      # Re-sync Worker-level secrets from GHA secrets. Same script path
      # as `bun run --cwd apps/mcp secrets:remote`. Latest = deployed at
      # this point because `wrangler deploy` just ran; `wrangler secret
      # bulk` requires that.
      - name: Sync Worker secrets (mirror-secrets-workers.sh)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Each secret by name, never `toJSON(secrets)` (SK-CIPERM-006): GitHub
          # holds a public repo's run that dumps every secret at
          # `action_required`. Keep in sync with select_secrets() in the script;
          # GRAFANA_CLOUD_* build GRAFANA_OTLP_AUTHORIZATION there.
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GRAFANA_OTLP_ENDPOINT: ${{ secrets.GRAFANA_OTLP_ENDPOINT }}
          GRAFANA_CLOUD_INSTANCE_ID: ${{ secrets.GRAFANA_CLOUD_INSTANCE_ID }}
          GRAFANA_CLOUD_API_KEY: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
        run: |
          # The script sources .envrc; the values above are already in env.
          : > .envrc
          ./scripts/mirror-secrets-workers.sh remote mcp
          rm -f .envrc
